[project]
docs_dir = "docs"
nav = [
  { "Главная" = "index.md" },
  { "Фундамент Computer Science" = [{ "Языки программирования и трансляция" = [{ "Теорема Бёма–Якопини" = "01 Фундамент Computer Science/Языки программирования и трансляция/Теорема Бёма–Якопини.md" }] }] },
  { "Java Core" = [{ "ООП" = [{ "Класс Object и его методы" = "03 Java Core/ООП/Класс Object и его методы.md" }, { "Контракт equals и hashCode" = "03 Java Core/ООП/Контракт equals и hashCode.md" }] }] },
  { "Ресурсы" = "Ресурсы.md" },
]
site_name = "My Java Knowledge"
site_description = "Структурированная база знаний по Java backend и программированию: от основ до уровня middle"
site_author = "Никита Москалёв"
site_url = "https://smesitejl.github.io/my-java-knowledge/"
repo_url = "https://github.com/SmesiteJl/my-java-knowledge"
repo_name = "SmesiteJl/my-java-knowledge"
copyright = "© 2026 Никита Москалёв · MIT"
extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "ru"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Светлая тема"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Тёмная тема"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Как в системе"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.quotes.callouts = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
